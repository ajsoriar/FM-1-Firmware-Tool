name: Build FM1FirmwareTool for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build and run checks
        shell: pwsh
        run: ./build.ps1

      - name: Upload executable artifact
        uses: actions/upload-artifact@v6
        with:
          name: FM1FirmwareTool-Windows-x64
          path: dist/FM1FirmwareTool-*-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows ZIP
        uses: actions/download-artifact@v8
        with:
          name: FM1FirmwareTool-Windows-x64
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --generate-notes
